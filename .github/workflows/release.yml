name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 是 arm64；macos-15-intel 是 x86_64（macos-13 已退役）
          - os: macos-14
            artifact: aarch64-macos
          - os: macos-15-intel
            artifact: x86_64-macos
    runs-on: ${{ matrix.os }}
    env:
      # 兼容到 macOS 13；zig 会把它作为产物的最低系统版本
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install libgit2
        run: brew install libgit2

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # zig 0.17 构建期经自身 HTTP 客户端拉包；CI 网络直连，正常可用
      - name: Build
        run: zig build --release=safe --search-prefix "$(brew --prefix libgit2)"

      - name: Package
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          pkg="starsheep_${ver}_${{ matrix.artifact }}"
          mkdir -p "$pkg/bin" "$pkg/share/starsheep"
          cp zig-out/bin/starsheep "$pkg/bin/"
          cp src/shell/init-zsh.sh "$pkg/share/starsheep/"
          tar czf "${pkg}.tar.gz" "$pkg"
          shasum -a 256 "${pkg}.tar.gz"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: starsheep_*.tar.gz
